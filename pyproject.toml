[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionai"
version = "0.1.0"
description = "Local-first Windows desktop assistant for voice, gesture, and keyboard/pointer input."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "structlog>=24.1,<25",
    "psutil>=6.0,<8",
    "pyautogui>=0.9.50,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=5.0,<6",
    "mypy>=1.10,<2",
    "types-psutil>=6.0,<8",
    "ruff>=0.5,<1",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
]
# Populated in later phases as audio, vision, UI, and intelligence
# subsystems are implemented and their exact dependencies are verified.
voice = []
vision = []
ui = []

[project.scripts]
visionai = "visionai.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/visionai"]
