[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionai"
version = "0.1.0"
description = "Local-first Windows desktop assistant for voice, gesture, and keyboard/pointer input."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "structlog>=24.1,<25",
    "psutil>=6.0,<8",
    "pyautogui>=0.9.50,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=5.0,<6",
    "pytest-qt>=4.4,<5",
    "mypy>=1.10,<2",
    "types-psutil>=6.0,<8",
    "ruff>=0.5,<1",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
]
ui = [
    "PySide6>=6.7,<7",
]
voice = [
    "sounddevice>=0.5,<1",
    "numpy>=2.0,<3",
    "faster-whisper>=1.2,<2",
]
# mediapipe is pinned exactly, not ranged: 0.10.35 and 1.0.1 were both
# checked and drop `mediapipe.solutions` from their Windows wheels in
# favor of a Tasks API needing a downloaded model file. 0.10.14 is the
# newest cp312 Windows wheel confirmed to still ship `solutions.hands`.
vision = [
    "mediapipe==0.10.14",
    "opencv-contrib-python>=4.5,<6",
    "numpy>=2.0,<3",
]
intelligence = [
    "anthropic>=1.2,<2",
]

[project.scripts]
visionai = "visionai.app:main"
visionai-ui = "visionai.ui.main_window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/visionai"]
