name: VisionAI CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  verify:
    name: Verify
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy src

      - name: Unit tests
        run: python -m pytest --cov=src/visionai --cov-report=term-missing

      - name: Bandit
        run: python -m bandit -q -r src

      - name: Dependency audit
        run: python -m pip_audit -r requirements/base.txt -r requirements/dev.txt
